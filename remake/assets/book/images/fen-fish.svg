<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300">
  <!-- The book's drawing of the Fen's fish (Task 7, chapter 2), Lepidotes's kind, from the side as it leaps: a deep body covered in
       thick, shining, diamond-shaped scales that lie together like tiles, olive on its back, gold on its flanks and pale beneath,
       with a forked tail, in the colours of the game's fish (world/critters/models.js), drawn soft and by hand on a clear background
       so a tile can show it as a silhouette. Our own drawing, until a photograph the owner approves (cards.json, the card's wanted)
       or the owner's drawing replaces it. -->
  <title>Fiskur</title>
  <defs>
    <filter id="hand" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M70 150C70 104 128 74 196 74C258 74 300 108 318 140C300 182 258 214 196 216C126 218 70 194 70 150Z"/>
    </clipPath>
  </defs>
  <g filter="url(#hand)" stroke="#3b2f25" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- drops of water, as it leaps -->
    <g fill="#d9eef0" stroke-width="3">
      <path d="M44 96C44 88 50 80 50 80C50 80 56 88 56 96C56 100 53 103 50 103C47 103 44 100 44 96Z"/>
      <path d="M352 82C352 76 357 70 357 70C357 70 362 76 362 82C362 85 360 87 357 87C354 87 352 85 352 82Z"/>
      <path d="M30 150C30 145 34 140 34 140C34 140 38 145 38 150C38 153 36 155 34 155C32 155 30 153 30 150Z"/>
    </g>
    <!-- the fins -->
    <path d="M178 78C188 52 214 40 238 42C232 58 222 72 212 80Z" fill="#8c8a5a"/>
    <path d="M184 212C192 234 210 246 228 246C226 232 220 220 212 212Z" fill="#8c8a5a"/>
    <path d="M128 200C130 220 142 232 156 236C156 224 152 212 146 204Z" fill="#8c8a5a"/>
    <!-- the forked tail -->
    <path d="M306 146C326 122 346 100 372 88C368 116 358 136 344 148C358 160 368 178 374 206C348 196 326 174 306 156Z" fill="#8c8a5a"/>
    <!-- the body, with its scales lying together like tiles -->
    <path d="M70 150C70 104 128 74 196 74C258 74 300 108 318 140C300 182 258 214 196 216C126 218 70 194 70 150Z" fill="#c8ad58"/>
    <g clip-path="url(#bodyClip)">
      <path d="M60 60C120 70 220 64 330 80L330 128C260 116 160 116 60 120Z" fill="#4c6652" stroke="none"/>
      <path d="M60 182C140 180 240 178 330 168L330 230L60 230Z" fill="#ece2c2" stroke="none"/>
      <g fill="none" stroke="#3b2f25" stroke-width="2.4" stroke-opacity=".4">
        <path d="M96 60L276 240M126 60L306 240M156 60L336 240M186 60L366 240M216 60L396 240M66 60L246 240M36 60L216 240M6 60L186 240M-24 60L156 240"/>
        <path d="M336 60L156 240M306 60L126 240M276 60L96 240M246 60L66 240M216 60L36 240M366 60L186 240M396 60L216 240M186 60L6 240M156 60L-24 240"/>
      </g>
      <g fill="#fff6d0" stroke="none" opacity=".55">
        <path d="M171 105L186 120L171 135L156 120Z"/><path d="M231 105L246 120L231 135L216 120Z"/><path d="M201 135L216 150L201 165L186 150Z"/>
      </g>
    </g>
    <path d="M70 150C70 104 128 74 196 74C258 74 300 108 318 140C300 182 258 214 196 216C126 218 70 194 70 150Z" fill="none"/>
    <!-- the head: smooth, behind a gill line, with a big eye and a smile -->
    <clipPath id="headClip">
      <path d="M142 70C110 74 66 104 66 150C66 194 108 220 142 220C128 184 126 116 142 70Z"/>
    </clipPath>
    <g clip-path="url(#bodyClip)">
      <g clip-path="url(#headClip)" stroke="none">
        <rect x="60" y="60" width="90" height="170" fill="#c8ad58"/>
        <path d="M60 60L150 60L150 112C118 112 90 122 60 138Z" fill="#4c6652"/>
        <path d="M60 188C90 190 120 194 150 194L150 230L60 230Z" fill="#ece2c2"/>
      </g>
    </g>
    <path d="M142 78C128 116 128 176 140 212" fill="none" stroke-width="4.5"/>
    <path d="M70 150C70 104 128 74 196 74C258 74 300 108 318 140C300 182 258 214 196 216C126 218 70 194 70 150Z" fill="none"/>
    <circle cx="104" cy="132" r="15" fill="#f2eedd" stroke-width="3.5"/>
    <g stroke="none">
      <circle cx="101" cy="134" r="8.5" fill="#16160f"/>
      <circle cx="98" cy="129" r="3.4" fill="#fff"/>
      <ellipse cx="114" cy="166" rx="8" ry="5" fill="#f0a3b6" opacity=".55"/>
    </g>
    <path d="M76 158C84 166 96 168 106 162" fill="none" stroke="#2b2a1c" stroke-width="4"/>
  </g>
</svg>
