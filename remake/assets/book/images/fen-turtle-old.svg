<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300">
  <!-- The book's drawing for the turtle card's third page (Task 7, chapter 2): one of the oldest turtles, Odontochelys's kind, from
       the side: a whole shell on its belly only, a bare back with its broad ribs and a row of small plates along its backbone, a long
       tail, and a smiling snout with tiny teeth, in the colours of the game's turtle (world/critters/models.js), drawn soft and by
       hand on a clear background. Our own drawing, until a photograph the owner approves (cards.json, the card's wanted) replaces it. -->
  <title>Ein elsta skjaldbakan</title>
  <defs>
    <filter id="hand" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#hand)" stroke="#3b2f25" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" transform="translate(4 -26)">
    <!-- the far legs -->
    <path d="M150 204C146 222 146 236 152 246C160 250 172 248 176 242C176 230 174 218 172 206Z" fill="#6a744d"/>
    <path d="M262 204C266 222 270 234 278 242C286 246 296 242 298 236C294 224 288 214 284 202Z" fill="#6a744d"/>
    <!-- the long tail -->
    <path d="M296 176C324 178 350 186 372 204C376 210 370 214 364 210C342 200 318 194 294 194Z" fill="#7f8a5e"/>
    <!-- the body: a bare back, low and long -->
    <path d="M100 186C100 150 140 124 200 122C260 120 300 146 308 182C310 192 304 198 296 198L108 200C102 200 100 194 100 186Z" fill="#7f8a5e"/>
    <!-- its broad ribs, under the skin of its back -->
    <path d="M150 140C144 156 140 172 140 190M176 130C172 150 170 170 170 192M204 126C204 148 204 170 204 194M232 128C236 150 238 172 238 194M260 136C266 154 270 172 270 194" fill="none" stroke="#5f6a44" stroke-width="5" stroke-opacity=".7"/>
    <!-- the row of small plates along its backbone -->
    <g fill="#7d7540" stroke="#b0a45e" stroke-width="3.5">
      <path d="M140 132L158 126L162 138L144 144Z"/><path d="M164 124L184 120L186 132L166 136Z"/><path d="M190 119L210 118L210 130L190 131Z"/>
      <path d="M216 118L236 120L234 132L214 130Z"/><path d="M242 122L260 128L256 139L238 133Z"/><path d="M265 131L281 140L275 150L259 141Z"/>
    </g>
    <!-- the whole shell on its belly, pale, plate by plate -->
    <path d="M104 196C150 208 250 210 304 194C306 206 298 216 284 218C230 226 170 226 120 218C108 216 102 206 104 196Z" fill="#d8c98a"/>
    <path d="M150 206L148 220M190 208L189 223M230 208L231 223M268 204L270 218" fill="none" stroke="#b0a45e" stroke-width="3.5"/>
    <!-- the head, with a smile full of tiny teeth -->
    <path d="M110 170C96 160 76 156 58 160C40 164 28 176 30 190C32 204 46 212 66 210C86 208 102 198 116 190Z" fill="#7f8a5e"/>
    <path d="M36 192C48 196 64 196 82 192" fill="none" stroke="#2b2a1c" stroke-width="4"/>
    <path d="M42 193L45 199L48 194M52 194L55 200L58 194.5M62 194.4L65 200L68 194M72 193.6L75 199L78 193" fill="#f6f1e4" stroke="#f6f1e4" stroke-width="1.6"/>
    <path d="M90 196C100 192 108 186 114 180" fill="none" stroke="#d9c45a" stroke-width="5"/>
    <circle cx="62" cy="174" r="12" fill="#f6f1e4" stroke-width="3.5"/>
    <g stroke="none">
      <circle cx="60" cy="176" r="7.5" fill="#1c1a12"/>
      <circle cx="57" cy="172" r="3" fill="#fff"/>
      <ellipse cx="86" cy="186" rx="8" ry="5" fill="#f0a3b6" opacity=".55"/>
    </g>
    <!-- the near legs -->
    <path d="M128 208C124 226 126 240 132 250C142 256 158 254 164 246C164 232 162 220 160 208Z" fill="#7f8a5e"/>
    <path d="M276 206C282 224 286 238 294 246C304 252 318 246 320 238C316 224 308 214 302 202Z" fill="#7f8a5e"/>
    <path d="M134 250L134 256M146 252L146 258M158 248L159 254M296 246L294 252M308 246L308 252M318 240L320 246" fill="none" stroke-width="3.5"/>
  </g>
</svg>
