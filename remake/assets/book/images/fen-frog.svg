<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300">
  <!-- The book's drawing for the frog card's Fen page (Task 7, chapter 2): frog spawn in the water, a clump of clear eggs with a dark
       dot in each, and a big tadpole swimming away from it with its long finned tail, beside a lily pad, in the frog's colours
       (world/critters/models.js), drawn soft and by hand on a clear background. Our own drawing, until a photograph the owner
       approves (cards.json, the page's wanted) replaces it. -->
  <title>Froskaegg og halakarta</title>
  <defs>
    <filter id="hand" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="35" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <g id="egg"><circle r="13" fill="#eef5e6" fill-opacity=".85" stroke-width="3"/><circle cx="1" cy="1" r="4.6" fill="#2b2a1c" stroke="none"/></g>
  </defs>
  <g filter="url(#hand)" stroke="#3b2f25" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- the water -->
    <ellipse cx="200" cy="170" rx="194" ry="116" fill="#bfe0dc" fill-opacity=".45" stroke="none"/>
    <path d="M60 230C100 240 150 244 200 240M230 70C270 64 310 66 344 76" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity=".7"/>
    <!-- a lily pad -->
    <path d="M330 220C330 196 352 180 374 184L362 210L388 214C390 236 372 252 350 250C336 248 330 236 330 220Z" fill="#4f8f36"/>
    <path d="M356 214L340 230M356 214L346 196" fill="none" stroke="#7dbb5a" stroke-width="3.5"/>
    <!-- the frog spawn: a clump of clear eggs -->
    <g>
      <use href="#egg" transform="translate(70 96)"/><use href="#egg" transform="translate(96 88)"/><use href="#egg" transform="translate(122 98)"/>
      <use href="#egg" transform="translate(58 120)"/><use href="#egg" transform="translate(84 114)"/><use href="#egg" transform="translate(110 122)"/>
      <use href="#egg" transform="translate(136 120)"/><use href="#egg" transform="translate(72 142)"/><use href="#egg" transform="translate(98 140)"/>
      <use href="#egg" transform="translate(124 146)"/><use href="#egg" transform="translate(88 164)"/><use href="#egg" transform="translate(112 168)"/>
    </g>
    <!-- the tadpole: a round body and a long tail with its fin -->
    <path d="M250 168C280 150 316 142 350 152C366 156 378 160 384 164C374 168 360 172 346 176C314 186 280 186 252 186Z" fill="#9cc77a" fill-opacity=".9"/>
    <path d="M250 172C284 168 320 166 360 164" fill="none" stroke="#58733a" stroke-width="6"/>
    <path d="M174 176C174 146 200 128 230 130C258 132 272 152 268 176C264 200 242 212 216 210C190 208 174 198 174 176Z" fill="#5f8a3e"/>
    <path d="M182 186C194 202 222 208 248 200C236 196 212 196 188 182Z" fill="#c9d98f" stroke-width="3.5"/>
    <ellipse cx="226" cy="150" rx="24" ry="9" fill="#7fae55" stroke="none" opacity=".8"/>
    <circle cx="202" cy="160" r="12" fill="#f6f1e4" stroke-width="3.5"/>
    <g stroke="none">
      <circle cx="200" cy="162" r="7" fill="#2b2a1c"/>
      <circle cx="197" cy="157" r="2.8" fill="#fff"/>
      <ellipse cx="214" cy="186" rx="8" ry="5" fill="#f0a3b6" opacity=".55"/>
    </g>
    <path d="M180 178C186 186 196 188 204 184" fill="none" stroke="#2f4a20" stroke-width="4"/>
    <!-- bubbles -->
    <g fill="#eaf6f6" stroke-width="2.6">
      <circle cx="164" cy="132" r="5"/><circle cx="154" cy="116" r="3.5"/>
    </g>
  </g>
</svg>
