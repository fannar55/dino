<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300">
  <!-- The book's drawing of the Fen's dragonfly (Task 7, chapter 2), seen from above as it rests with its four wings flat out: the
       green thorax, the long blue tail with its bands, and the big eyes that meet on top of its head (its legs are tucked under it), in the colours of the game's
       dragonfly (world/critters/models.js), drawn soft and by hand on a clear background so a tile can show it as a silhouette.
       Our own drawing, until a photograph the owner approves (cards.json, the card's wanted) or the owner's drawing replaces it. -->
  <title>Drekafluga</title>
  <defs>
    <filter id="hand" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="fore" d="M138 136C126 104 106 62 104 40C103 28 112 22 124 26C146 34 162 84 160 134Z"/>
    <path id="hind" d="M160 138C164 104 180 62 200 40C210 29 224 32 226 44C229 70 206 112 184 140Z"/>
    <path id="foreVeins" d="M144 128C134 100 120 66 114 40M150 130C148 104 140 72 128 34"/>
    <path id="hindVeins" d="M166 134C176 104 192 70 210 42M174 136C190 110 206 80 218 46"/>
  </defs>
  <g filter="url(#hand)" stroke="#3b2f25" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- four wings, clear as glass with their veins and the dark spot near each tip -->
    <g fill="#e7f3f5" fill-opacity=".9" stroke-width="4">
      <use href="#fore"/><use href="#hind"/>
      <use href="#fore" transform="matrix(1 0 0 -1 0 300)"/><use href="#hind" transform="matrix(1 0 0 -1 0 300)"/>
    </g>
    <g fill="none" stroke="#b9d3d8" stroke-width="2.4">
      <use href="#foreVeins"/><use href="#hindVeins"/>
      <use href="#foreVeins" transform="matrix(1 0 0 -1 0 300)"/><use href="#hindVeins" transform="matrix(1 0 0 -1 0 300)"/>
    </g>
    <g fill="#3a3226" stroke="none">
      <ellipse cx="112" cy="38" rx="5" ry="3.2" transform="rotate(70 112 38)"/>
      <ellipse cx="214" cy="42" rx="5" ry="3.2" transform="rotate(-62 214 42)"/>
      <ellipse cx="112" cy="262" rx="5" ry="3.2" transform="rotate(-70 112 262)"/>
      <ellipse cx="214" cy="258" rx="5" ry="3.2" transform="rotate(62 214 258)"/>
    </g>
    <!-- the long tail, blue with darker bands, thinning to its tip -->
    <path d="M160 140C210 138 280 141 342 145C356 146 364 148 364 150C364 152 356 154 342 155C280 159 210 162 160 160Z" fill="#2f86bd"/>
    <path d="M196 141L197 159M226 141L227 158M256 142L257 157M284 143L285 157M310 144L311 156M334 145L335 155" fill="none" stroke="#246b98" stroke-width="5"/>
    <path d="M176 146C230 145 290 147 340 149" fill="none" stroke="#8fd0f0" stroke-width="3" stroke-opacity=".55"/>
    <!-- the thorax, green -->
    <ellipse cx="140" cy="150" rx="30" ry="22" fill="#4f9e4c"/>
    <ellipse cx="136" cy="144" rx="16" ry="8" fill="#7cc45e" stroke="none" opacity=".85"/>
    <!-- the head, nearly all eyes: two big ones that meet on top -->
    <circle cx="96" cy="150" r="16" fill="#4f9e4c"/>
    <circle cx="80" cy="133" r="21" fill="#3aa6b5"/>
    <circle cx="80" cy="167" r="21" fill="#3aa6b5"/>
    <g stroke="none">
      <ellipse cx="74" cy="126" rx="10" ry="7" fill="#8fd8de" opacity=".9"/>
      <ellipse cx="74" cy="160" rx="10" ry="7" fill="#8fd8de" opacity=".9"/>
      <circle cx="72" cy="136" r="8.5" fill="#1e2a2c"/>
      <circle cx="72" cy="170" r="8.5" fill="#1e2a2c"/>
      <circle cx="69" cy="132" r="3.4" fill="#fff"/>
      <circle cx="69" cy="166" r="3.4" fill="#fff"/>
    </g>
  </g>
</svg>
