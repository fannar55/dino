<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300">
  <!-- The book's drawing of the Fen's salamander (Task 7, chapter 2), from the side as it crawls: newt-like, a dark olive back with
       gold spots, an orange belly, short splayed legs with little toes and a long tail, in the colours of the game's salamander
       (world/critters/models.js), drawn soft and by hand on a clear background so a tile can show it as a silhouette. Our own
       drawing, until a photograph the owner approves (cards.json, the card's wanted) or the owner's drawing replaces it. -->
  <title>Salamandra</title>
  <defs>
    <filter id="hand" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="25" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#hand)" stroke="#3b2f25" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- the far legs, behind the body -->
    <path d="M118 196C122 212 120 224 112 232M226 196C236 210 240 222 236 232" fill="none" stroke-width="13"/>
    <path d="M118 196C122 212 120 224 112 232M226 196C236 210 240 222 236 232" fill="none" stroke="#3f3d25" stroke-width="7"/>
    <!-- the long tail, curling up at its tip -->
    <path d="M250 168C290 166 322 172 346 160C366 150 374 130 366 116C362 110 354 112 356 120C360 132 350 142 334 146C306 152 280 150 250 196Z" fill="#4c4a2d"/>
    <path d="M262 190C292 178 322 170 346 158" fill="none" stroke="#e2833a" stroke-width="5" stroke-opacity=".9"/>
    <!-- the body: dark back, orange belly -->
    <path d="M70 172C70 146 98 132 140 130C190 128 236 136 262 160C276 174 270 196 248 202C206 212 150 214 110 208C84 204 70 192 70 172Z" fill="#4c4a2d"/>
    <path d="M86 196C120 206 182 208 240 200C254 198 262 192 264 184C230 196 160 198 92 186Z" fill="#e2833a" stroke-width="3.5"/>
    <path d="M110 140C150 134 200 136 238 150" fill="none" stroke="#5f5c37" stroke-width="9" stroke-opacity=".9"/>
    <!-- the gold spots -->
    <g fill="#d8b23e" stroke-width="3">
      <circle cx="132" cy="150" r="6"/><circle cx="160" cy="142" r="5"/><circle cx="188" cy="152" r="6.5"/>
      <circle cx="214" cy="146" r="5"/><circle cx="236" cy="162" r="5.5"/><circle cx="150" cy="170" r="4.5"/>
      <circle cx="200" cy="176" r="4.5"/><circle cx="286" cy="160" r="4.5"/><circle cx="316" cy="158" r="4"/><circle cx="342" cy="150" r="3.5"/>
    </g>
    <!-- the near legs, splayed, with little toes -->
    <path d="M128 200C132 220 126 234 112 244M236 196C252 210 258 226 252 240" fill="none" stroke-width="15"/>
    <path d="M128 200C132 220 126 234 112 244M236 196C252 210 258 226 252 240" fill="none" stroke="#4c4a2d" stroke-width="9"/>
    <g fill="#4c4a2d" stroke-width="3">
      <circle cx="100" cy="246" r="5"/><circle cx="108" cy="252" r="5"/><circle cx="118" cy="252" r="5"/>
      <circle cx="244" cy="248" r="5"/><circle cx="254" cy="250" r="5"/><circle cx="262" cy="244" r="5"/>
    </g>
    <!-- the head, round and smiling -->
    <path d="M40 160C40 136 62 122 88 126C110 130 122 146 120 166C118 186 100 198 76 196C54 194 40 180 40 160Z" fill="#4c4a2d"/>
    <path d="M48 176C62 190 92 194 112 182" fill="none" stroke="#e2833a" stroke-width="5" stroke-opacity=".85"/>
    <circle cx="74" cy="146" r="14" fill="#1c1a12" stroke-width="3.5"/>
    <g stroke="none">
      <circle cx="69" cy="141" r="5" fill="#f6f1e4"/>
      <circle cx="78" cy="151" r="2.2" fill="#f6f1e4"/>
      <ellipse cx="96" cy="172" rx="9" ry="5.5" fill="#f0a3b6" opacity=".55"/>
    </g>
    <path d="M50 170C60 180 76 182 88 176" fill="none" stroke="#2b2a1c" stroke-width="4"/>
  </g>
</svg>
