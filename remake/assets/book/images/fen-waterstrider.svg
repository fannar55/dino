<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300">
  <!-- The book's drawing of the Fen's water strider, vatnalæsingi (Task 7, chapter 2), from above as it stands on the water: a slender
       dark bug on long, thin legs, the middle pair rowing and the hind pair steering, a faint ring round each foot where the water's
       skin gives (so faint that an unfound tile's silhouette is the animal alone), with the short front pair held up, in the colours of the game's water strider (world/critters/models.js),
       drawn soft and by hand on a clear background so a tile can show it as a silhouette. Our own drawing, until a photograph the
       owner approves (cards.json, the card's wanted) or the owner's drawing replaces it. -->
  <title>Vatnalæsingi</title>
  <defs>
    <filter id="hand" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="33" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- the left legs (the right ones are their mirror): the middle pair out and forward, the hind pair back -->
    <path id="legs" d="M174 146C140 128 98 104 52 78M196 162C170 192 142 222 104 262M160 132C148 118 140 104 138 92"/>
    <g id="rings">
      <ellipse cx="52" cy="78" rx="16" ry="6"/><ellipse cx="104" cy="262" rx="16" ry="6"/>
    </g>
  </defs>
  <g filter="url(#hand)" stroke="#3b2f25" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- a faint ring round each foot, where the water's skin gives -->
    <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity=".28">
      <use href="#rings"/><use href="#rings" transform="matrix(-1 0 0 1 400 0)"/>
    </g>
    <!-- the long thin legs -->
    <use href="#legs" fill="none" stroke-width="8"/>
    <use href="#legs" fill="none" stroke="#2d2a24" stroke-width="3.5"/>
    <use href="#legs" fill="none" stroke-width="8" transform="matrix(-1 0 0 1 400 0)"/>
    <use href="#legs" fill="none" stroke="#2d2a24" stroke-width="3.5" transform="matrix(-1 0 0 1 400 0)"/>
    <!-- the slender body -->
    <path d="M200 112C214 112 222 126 222 150C222 186 214 222 200 238C186 222 178 186 178 150C178 126 186 112 200 112Z" fill="#2d2a24"/>
    <path d="M200 150L200 226" fill="none" stroke="#b9bbb6" stroke-width="3" stroke-opacity=".7"/>
    <path d="M190 128C194 122 200 120 206 122" fill="none" stroke="#7d786c" stroke-width="3.5"/>
    <!-- the head, with its feelers and a pair of round eyes -->
    <path d="M186 96C188 86 186 74 178 64M214 96C212 86 214 74 222 64" fill="none" stroke="#2d2a24" stroke-width="3.5"/>
    <path d="M200 86C212 86 218 96 218 106C218 114 210 118 200 118C190 118 182 114 182 106C182 96 188 86 200 86Z" fill="#2d2a24"/>
    <circle cx="186" cy="100" r="9" fill="#e9dfb8" stroke-width="3"/>
    <circle cx="214" cy="100" r="9" fill="#e9dfb8" stroke-width="3"/>
    <g stroke="none">
      <circle cx="187" cy="102" r="5" fill="#6b5a3a"/>
      <circle cx="213" cy="102" r="5" fill="#6b5a3a"/>
      <circle cx="185" cy="99" r="2" fill="#fff"/>
      <circle cx="211" cy="99" r="2" fill="#fff"/>
    </g>
    <path d="M194 112C198 115 202 115 206 112" fill="none" stroke="#e9dfb8" stroke-width="3"/>
  </g>
</svg>
