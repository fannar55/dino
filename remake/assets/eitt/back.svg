<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The back of every card in "Eitt!": one tile of a pattern of Kambeðla's plates, rows of them set half a plate apart, to
       lie over the card's violet (eitt.css). -->
  <defs>
    <path id="p" d="M-8.5 0L-11-14.5Q-11.5-17.5-9-19.8L-1.7-29.5Q0-31.3 1.7-29.5L9-19.8Q11.5-17.5 11-14.5L8.5 0Z"/>
    <g id="plate">
      <use href="#p" fill="#b896cf"/>
      <path d="M0-2V-26M-1.5-3L-6.5-19M1.5-3L6.5-19" fill="none" stroke="#d9c2e8" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
    </g>
  </defs>
  <use href="#plate" transform="translate(16 30)"/>
  <use href="#plate" transform="translate(48 62)"/>
  <use href="#plate" transform="translate(48 -2)"/>
  <use href="#plate" transform="translate(-16 62)"/>
  <use href="#plate" transform="translate(80 62)"/>
  <use href="#plate" transform="translate(-16 -2)"/>
  <use href="#plate" transform="translate(80 -2)"/>
  <use href="#plate" transform="translate(16 94)"/>
  <circle cx="48" cy="18" r="1.8" fill="#d9c2e8" opacity=".7"/>
  <circle cx="16" cy="50" r="1.8" fill="#d9c2e8" opacity=".7"/>
</svg>
