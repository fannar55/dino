<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosi — bókin (tilraunasíða)</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>

<style>
  /* The lab only, and never linked from the game: a stand-in for the paused forest behind the book, with the game's own
     journal button. ?state= picks what shows:
       stars, animals (the default)  the real book (engine/book/book.js) over the placeholder cards, open on that ribbon;
                                     it closes into the button, and the button opens it again
       card, zoom, info              the mockup's static card, zoomed picture and credit window, until Tasks 8 and 9 build
                                     them; the info state's page shows one of the old game's licensed fossils, read from
                                     dist/ in place, with its ⓘ open. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 24% 34% at 10% 44%, #3f6c4c 0 97%, transparent 100%),
      radial-gradient(ellipse 15% 24% at 27% 37%, #4f7a5a 0 97%, transparent 100%),
      radial-gradient(ellipse 27% 36% at 88% 42%, #2e5544 0 97%, transparent 100%),
      radial-gradient(ellipse 14% 20% at 68% 35%, #7fa64c 0 97%, transparent 100%),

      linear-gradient(#cfdde3 0%, #e6e7cf 44%, #8fae52 57%, #55703a 100%);
  }
</style>

      <svg class="book-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M13 13.5C19 20 28 28.5 35 35M35 13C28.5 20 20 28 13 35" stroke-width="6.5"/></svg>
    </button>

<script type="module">
  // The lab's logic. The real book's states open it over the placeholder cards (assets/book/), with a save in memory that has
  // Kambeðla's star and the butterfly, as after chapter 1's ride; the mockup's states show its static layers, each layer naming
  // its states in data-states. Sound starts with the first touch, as the browser wants. capture.mjs waits for __demoReady,
  // which comes once every picture has loaded, the book has finished opening and the page has drawn; __demoStats then says how
  // big the smallest control within reach is, and how many are off the screen (Review Focus 4).
  import { createBook } from './engine/book/book.js';
  import { createBookAudio } from './engine/book/book-audio.js';
  import { parseCards } from './engine/book/cards.js';
  import { parseManifest } from './engine/book/media.js';
  import { createJournal } from './engine/scene/journal.js';
  import { createSave } from './engine/save.js';
  import { createAudioContext, createOutput } from './engine/audio/output.js';

  const asked = new URLSearchParams(location.search).get('state');
  const state = ['stars', 'animals', 'card', 'zoom', 'info'].includes(asked) ? asked : 'animals';
  const read = async path => (await fetch(path)).json();
  const [cards, media, theme, lines] = await Promise.all([
    read('./assets/book/cards.json'), read('./assets/book/media-manifest.json'), read('./assets/audio/theme.json'), read('./assets/audio/lines.json'),
  ]);
  const save = createSave(null);
  save.addStar('k1_kambedla');
  save.addFinding('butterfly');
  const context = createAudioContext();
  addEventListener('pointerdown', () => context?.resume?.().catch?.(() => {}), { capture: true });
  const audio = createBookAudio({ context, output: context && createOutput(context), theme, lines });
  const book = createBook(document, { cards: parseCards(cards), media: parseManifest(media), save, audio, win: window, onPause: () => {} });
  createJournal(document, save, { book, audio });
  Object.assign(window, { __book: book, __bookAudio: audio });

  if (state === 'stars' || state === 'animals') book.open(state, 'child');
  else for (const layer of document.querySelectorAll('[data-states]')) layer.hidden = !layer.dataset.states.split(' ').includes(state);
  document.getElementById('mockup').hidden = state === 'stars' || state === 'animals';

  /** The book's controls a finger can reach (shown, and on top where they are): the smallest one's size, and any off the screen. */
  function measure() {
    const controls = '.chunky, .ribbon, .tile, .card-arrow, .card-replay, .card-info, .card-back, .book-close, .zoom-close';
    const live = [...document.querySelectorAll(controls)].filter(el => {
      if (!el.getClientRects().length || getComputedStyle(el).visibility === 'hidden') return false;
      const r = el.getBoundingClientRect();
      const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      return Boolean(hit) && (hit === el || el.contains(hit));
    });
    const rects = live.map(el => el.getBoundingClientRect());
    return {
      smallestTargetPx: Math.round(Math.min(...rects.map(r => Math.min(r.width, r.height)))),
      controls: live.length,
      offscreen: rects.filter(r => r.left < 0 || r.top < 0 || r.right > innerWidth || r.bottom > innerHeight).length,
    };
  }

  await document.fonts.ready;
  if (document.readyState !== 'complete') await new Promise(resolve => addEventListener('load', resolve, { once: true }));
  const opening = document.getAnimations().filter(animation => animation.effect?.getTiming().iterations !== Infinity);
  await Promise.all(opening.map(animation => animation.finished.catch(() => {})));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.__demoStats = measure();
    window.__demoReady = true;
  }));
</script>
</body>
