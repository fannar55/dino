<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosi — bókin (tilraunasíða)</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./book.css">
<script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js"}}</script>
<style>
  /* The lab only, and never linked from the game: a stand-in for the paused forest behind the book, with the game's own
     journal button. The real book (engine/book/book.js) opens over it on the cards in assets/book/, with a save in memory. ?state= picks
     what shows:
       animals (the default), dinosaurs, fossils   the book open on that ribbon (Risaeðlur, Dýrin, Safnið); it closes into the button, and the
                                      button opens it again
       map                            the Kortið page; ?progress= says how far the child has got, one friend a chapter as the game's script has it:
                                      0 (a fresh save, no trail), 1 (chapter 1 done), 2 (chapter 2 come to the Fen), 3 (Þórseðla's star too, the
                                      default: the three far friends are found from her head, so Slóeðla's, Flugeðla's and Uggeðla's stickers are
                                      on the map, and the way ahead is d, to Slóeðla), 4 (Slóeðla's star too, chapter 3), 5 (Flugeðla's, chapter 4),
                                      6 (Uggeðla's, chapter 5) or 7 (Grameðla's star too, chapter 6: every piece of the trail, a to g); the piece
                                      not reached yet shows ahead as a dotted line, its slot pulsing, and the red dot stands at the end of the
                                      last piece drawn; the trail draws itself in once, with the dot riding at its head, and
                                      ?seen=1 has it drawn in before, as on a later visit (and the mist already drawn back from Grameðla), and
                                      ?at=<ms> holds the drawing and the dot at that moment from the page's opening (the first piece starts at 560,
                                      each next 2150 later) for a picture of it half drawn; the water is lit by a gliding light and the mist drifts
                                      on every map, and with ?progress=7 and no ?seen=1 the mist opens round Grameðla's circle (560 ms in, over 2 s)
       card                           a card open on its first page (?card=<id>, kalligrammatid unless told another)
       zoom                           Kambeðla's third page, whose picture is zoomed to the whole screen
       info                           the same page with its ⓘ window open (credit, licence and source)
     Also: ?card=<id> and ?page=<n> (from 1) open any card at any page, on the Risaeðlur or the Dýrin page as its group says;
     ?found=all finds every animal and fossil and meets every dinosaur, and opens every game, as after the whole book is full (the
     first look at Safnið then cheers, once); ?fossils=<kind>,<kind> finds those fossils (ammonite, trilobite, tooth, footprint, leaf, amber, egg, skeleton);
     ?find=<id>,<id> finds those animals; ?spread=<n> turns the Dýrin page to that spread at its corner, as a child would;
     ?card=<id>&page=<n>&model=<path> makes that page a 3D page, its model a GLB read from remake/ (model=assets/characters/mosi.glb), as
     a card's page does with a "model" of its own (the picture stays where there is no WebGL or the model will not load).
     __demoStats.cornerSteals counts the points of the tiles in view that a corner takes instead (none is right), on a 24 × 24 grid
     over each tile, and cornerBoxes gives each corner's drawn shape (its turned-up corner and arrow) in screen pixels. */
  .no-corner-hits .spread-turn * { pointer-events: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 24% 34% at 10% 44%, #3f6c4c 0 97%, transparent 100%),
      radial-gradient(ellipse 15% 24% at 27% 37%, #4f7a5a 0 97%, transparent 100%),
      radial-gradient(ellipse 27% 36% at 88% 42%, #2e5544 0 97%, transparent 100%),
      radial-gradient(ellipse 14% 20% at 68% 35%, #7fa64c 0 97%, transparent 100%),
      radial-gradient(ellipse 70% 16% at 48% 66%, #a6b84a 0 97%, transparent 100%),
      linear-gradient(#cfdde3 0%, #e6e7cf 44%, #8fae52 57%, #55703a 100%);
  }
</style>
</head>
<body>
<button id="journal-button" class="journal-button" type="button" aria-label="Landkönnuðabók Egils" hidden>
  <svg class="journal-icon" viewBox="0 0 48 48" aria-hidden="true">
    <rect x="9" y="5" width="31" height="38" rx="5" fill="#e07a3f" stroke="#3b2f25" stroke-width="2.5"/>
    <path d="M9 10a5 5 0 0 1 5-5h4v38h-4a5 5 0 0 1-5-5z" fill="#c9622b" stroke="#3b2f25" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M28 13.5l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z" fill="#f2b630" stroke="#3b2f25" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M32 43v-9h7v9l-3.5-2.4z" fill="#2f8f86" stroke="#3b2f25" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>
  <span id="star-slots" class="star-slots" aria-hidden="true"></span>
  <span id="journal-badge" class="journal-badge" aria-hidden="true" hidden>
    <svg viewBox="0 0 40 40"><path d="M20 3C21.6 13 27 18.4 37 20C27 21.6 21.6 27 20 37C18.4 27 13 21.6 3 20C13 18.4 18.4 13 20 3Z"/></svg>
  </span>
</button>
<div id="journal-flights" class="journal-flights" aria-hidden="true"></div>
<div id="book" class="book" hidden></div>
<script type="module">
  // The lab's logic. The book opens over the cards (assets/book/) with a save in memory that has Kambeðla's star and the butterfly,
  // as after chapter 1's ride, and Mosi and Kambeðla already opened, so the Risaeðlur page shows the two found and the five others not
  // met, and the animals page a new animal and the rest unfound. The card, zoom and info states open the card by tapping through it, as a child would. Sound starts with the first touch, as
  // the browser wants. capture.mjs waits for __demoReady, which comes once every picture has loaded, the book and what the state
  // asked for have finished moving and the page has drawn; __demoStats then says how big the smallest control within reach is, and
  // how many are off the screen (Review Focus 4).
  import { createBook } from './engine/book/book.js';
  import { createBookAudio } from './engine/book/book-audio.js';
  import { parseCards } from './engine/book/cards.js';
  import { parseManifest, parseModels } from './engine/book/media.js';
  import { createJournal } from './engine/scene/journal.js';
  import { createSave } from './engine/save.js';
  import { FOSSIL_KINDS } from './engine/hals/rules.js';
  import { createAudioContext, createOutput } from './engine/audio/output.js';

  const params = new URLSearchParams(location.search);
  const asked = params.get('state');
  const state = ['dinosaurs', 'animals', 'fossils', 'map', 'card', 'zoom', 'info'].includes(asked) ? asked : 'animals';
  const read = async path => (await fetch(path)).json();
  const [cardData, mediaData, theme, lines] = await Promise.all([
    read('./assets/book/cards.json'), read('./assets/book/media-manifest.json'), read('./assets/audio/theme.json'), read('./assets/audio/lines.json'),
  ]);
  const cards = parseCards(cardData);
  // The card that ?state= or ?card= asks for (kalligrammatid unless told another, kambedla for the zoom and ⓘ), and the page of it.
  const cardAsked = state === 'card' || state === 'zoom' || state === 'info' || params.has('card');
  const cardId = params.get('card') ?? (state === 'zoom' || state === 'info' ? 'kambedla' : 'kalligrammatid');
  const pageAsked = Number(params.get('page') ?? (state === 'zoom' || state === 'info' ? 3 : 1)) - 1;
  const modelPage = cards.find(card => card.id === cardId)?.pages[Math.max(0, pageAsked)];
  if (cardAsked && params.has('model') && modelPage) modelPage.model = params.get('model'); // a look at a 3D page
  const save = createSave(null);
  const progress = state === 'map' ? Number(params.get('progress') ?? 3) : 1; // the map's states: how far the child has got
  if (progress >= 1) save.addStar('k1_kambedla');
  if (progress >= 2) save.addPlace('fen');
  if (progress >= 3) { // Þórseðla's star, and the three far friends found from her head (chapter 2): on the map, but not yet visited
    save.addStar('k2_thorsedla');
    for (const id of ['sloedla', 'flugedla', 'uggedla']) save.addPlace(id);
  }
  if (progress >= 4) save.addStar('k3_sloedla'); // chapters 3 to 6, one friend each: Slóeðla, Flugeðla, Uggeðla, Grameðla
  if (progress >= 5) save.addStar('k4_flugedla');
  if (progress >= 6) save.addStar('k5_uggedla');
  if (progress >= 7) save.addStar('k6_gramedla');
  if (state === 'map' && params.get('seen') === '1') for (const id of ['map-route-a', 'map-route-b', 'map-route-c', 'map-route-d', 'map-route-e', 'map-route-f', 'map-route-g', 'map-mist-gramedla']) save.addSeen(id);
  save.addFinding('butterfly');
  save.addSeen('mosi');
  save.addSeen('kambedla');
  for (const id of (params.get('find') ?? '').split(',').filter(Boolean)) save.addFinding(id);
  for (const kind of (params.get('fossils') ?? '').split(',').filter(Boolean)) save.addHalsFound(kind);
  if (params.get('found') === 'all') {
    for (const card of cards) {
      if (card.unlock.found) save.addFinding(card.unlock.found);
      if (card.unlock.star) save.addStar(card.unlock.star);
      if (card.unlock.place) save.addPlace(card.unlock.place);
      if (card.unlock.fossil) save.addHalsFound(card.unlock.fossil);
    }
    for (const kind of FOSSIL_KINDS) save.addHalsFound(kind.id);
  }
  const context = createAudioContext();
  addEventListener('pointerdown', () => context?.resume?.().catch?.(() => {}), { capture: true });
  const audio = createBookAudio({ context, output: context && createOutput(context), theme, lines });
  const book = createBook(document, { cards, media: parseManifest(mediaData), models: parseModels(mediaData), save, audio, win: window, onPause: () => {} });
  createJournal(document, save, { book, audio });
  Object.assign(window, { __book: book, __bookAudio: audio, __save: save });

  /** A finger that touches `selector`'s element and lifts again, which is all a tap is. */
  function tap(selector) {
    const el = document.querySelector(selector);
    const r = el.getBoundingClientRect();
    const at = { bubbles: true, pointerId: 7, button: 0, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 };
    el.dispatchEvent(new PointerEvent('pointerdown', at));
    el.dispatchEvent(new PointerEvent('pointerup', at));
  }

  /** Waits until the fonts and pictures are there and nothing is moving but the book's idle life. */
  async function settle() {
    await document.fonts.ready;
    if (document.readyState !== 'complete') await new Promise(resolve => addEventListener('load', resolve, { once: true }));
    for (let round = 0; round < 3; round++) {
      await Promise.all([...document.images].map(img => img.decode?.().catch(() => {})));
      const moving = document.getAnimations().filter(animation => animation.effect?.getTiming().iterations !== Infinity && animation.playState !== 'paused');
      await Promise.all(moving.map(animation => animation.finished.catch(() => {})));
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }
  }

  /** The book's controls a finger can reach (shown, and on top where they are): the smallest one's size, and any off the screen. */
  function measure() {
    const controls = '.chunky, .ribbon, .tile, .card-arrow, .card-replay, .card-info, .card-back, .card-done, .card-photo, .book-close, .zoom-close';
    const live = [...document.querySelectorAll(controls)].filter(el => {
      if (!el.getClientRects().length || getComputedStyle(el).visibility === 'hidden') return false;
      const r = el.getBoundingClientRect();
      const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      return Boolean(hit) && (hit === el || el.contains(hit));
    });
    const rects = live.map(el => el.getBoundingClientRect());
    // The corners take only what is drawn of them: no point of a tile in view may land on one instead.
    const tiles = [...document.querySelectorAll('.tile')].filter(el => el.getClientRects().length && el.closest('.book-leaf:not([hidden])'));
    const corners = [...document.querySelectorAll('.spread-turn')].filter(el => !el.hidden && el.closest('.book-leaf:not([hidden])'));
    const points = tiles.flatMap(tile => {
      const r = tile.getBoundingClientRect();
      return Array.from({ length: 576 }, (_, i) => ({ tile, x: r.left + r.width * ((i % 24) + 0.5) / 24, y: r.top + r.height * (Math.floor(i / 24) + 0.5) / 24 }));
    });
    document.body.classList.add('no-corner-hits');
    const onTile = points.filter(p => p.tile.contains(document.elementFromPoint(p.x, p.y)));
    document.body.classList.remove('no-corner-hits');
    const cornerSteals = onTile.filter(p => document.elementFromPoint(p.x, p.y)?.closest('.spread-turn')).length;
    const box = list => {
      const rs = list.map(el => el.getBoundingClientRect());
      const [l, t, r, b] = [Math.min(...rs.map(q => q.left)), Math.min(...rs.map(q => q.top)), Math.max(...rs.map(q => q.right)), Math.max(...rs.map(q => q.bottom))];
      return { left: Math.round(l), top: Math.round(t), width: Math.round(r - l), height: Math.round(b - t) };
    };
    return {
      smallestTargetPx: Math.round(Math.min(...rects.map(r => Math.min(r.width, r.height)))),
      controls: live.length,
      offscreen: rects.filter(r => r.left < 0 || r.top < 0 || r.right > innerWidth || r.bottom > innerHeight).length,
      tilePoints: onTile.length,
      cornerSteals,
      cornerBoxes: corners.map(c => ({ way: c.classList.contains('next') ? 'next' : 'prev', drawn: box([...c.querySelectorAll('.corner-under, .corner-flap, .book-arrow')]) })),
      tileBoxes: tiles.map(t => ({ card: t.getAttribute('data-card'), ...box([t]) })),
    };
  }

  // The page the book opens on: the dinosaurs' for ?state=dinosaurs, and for a card of a dinosaur (Mosi's, Kambeðla's), else the animals'.
  const onDinosaurs = state === 'dinosaurs' || (cardAsked && cards.find(card => card.id === cardId)?.group === 'dinosaur');
  book.open(state === 'fossils' ? 'fossils' : state === 'map' ? 'map' : onDinosaurs ? 'dinosaurs' : 'animals', 'child');
  if (state === 'map' && params.has('at')) { // the trail's drawing held at a moment, to be looked at: the line's, and the dot's riding at its head
    for (const animation of document.getAnimations()) {
      const target = animation.effect?.target;
      if (target?.classList?.contains('map-route-reveal') || target?.classList?.contains('map-dot')) { animation.pause(); animation.currentTime = Number(params.get('at')); }
    }
  }
  await settle();
  for (let n = 1; n < Number(params.get('spread') ?? 1); n++) {
    const corner = document.querySelector(`.book-leaf[data-spread="${n}"] .spread-turn.next`);
    if (!corner || corner.hidden) break;
    tap(`.book-leaf[data-spread="${n}"] .spread-turn.next`);
    await settle();
  }
  if (cardAsked) {
    book.openCard(cardId, Math.max(0, pageAsked));
    await settle();
    if (params.has('model')) { // the model comes after the page: wait for it (or for the picture to stay, when it cannot come)
      const since = Date.now();
      while (!document.querySelector('.card-model:not([hidden])') && Date.now() - since < 8000) await new Promise(resolve => setTimeout(resolve, 100));
      await settle();
    }
    if (state === 'info') tap('.card-info');
    if (state === 'zoom') tap('.card-photo');
    await settle();
  }
  window.__demoStats = measure();
  window.__demoReady = true;
</script>
</body>
</html>
