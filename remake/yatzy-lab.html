<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risaeðlu-Yatzy — tilraunasíða</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./book.css">
<link rel="stylesheet" href="./yatzy.css">
<script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<script>
  // Browsers block ES module imports on file:// URLs. If opened directly from disk, hop to the local server.
  if (location.protocol === 'file:') {
    location.replace('http://127.0.0.1:4196/remake/yatzy-lab.html' + location.search);
  }
</script>
</head>
<body>
<main class="yatzy" id="yatzy"></main>
<script type="module">
  import { createYatzyGame } from './engine/yatzy/table.js';
  import { createSave } from './engine/save.js';
  import { createAudioContext, createOutput } from './engine/audio/output.js';

  const params = new URLSearchParams(location.search);
  const read = async path => {
    try {
      const response = await fetch(path);
      return response.ok ? await response.json() : null;
    } catch {
      return null;
    }
  };
  const [lines, theme] = await Promise.all([read('./assets/audio/lines.json'), read('./assets/audio/theme.json')]);
  const context = createAudioContext();
  const output = context && createOutput(context);
  const save = createSave(undefined, 'mosi-yatzy-lab');
  if (params.has('skill')) save.setYatzy({ skill: Number(params.get('skill')) });

  // Custom deterministic seed rolls for visual states (?state=yatzy|egg|mosi); ?state=win: one row left, and picking it ends the game
  const state = params.get('state') || 'live';
  let rollQueue = [];
  if (state === 'yatzy') {
    rollQueue = [5, 5, 5, 5, 5]; // Five Slóeðlur!
  } else if (state === 'egg') {
    rollQueue = [5, 5, 1, 2, 3];
  } else if (state === 'mosi') {
    rollQueue = [1, 1, 1, 4, 6];
  }
  const random = () => {
    if (rollQueue.length > 0) {
      const face = rollQueue.shift();
      return (face - 0.5) / 6;
    }
    return Math.random();
  };

  const tutParam = params.get('tutorial');
  const isSpecialDemo = state === 'yatzy' || state === 'mosi' || state === 'egg' || state === 'win';
  const isTutorialDemo = state.startsWith('tutorial');
  const tutorialOpt =
    tutParam === '1' || isTutorialDemo
      ? true
      : tutParam === '0' || isSpecialDemo
        ? false
        : null;

  const game = createYatzyGame(document, {
    save,
    audio: { context, output, theme, lines: lines ?? {} },
    random,
    onClose: () => setTimeout(() => game.open(), 600),
  });
  addEventListener('pointerdown', () => context?.resume?.(), { capture: true });
  addEventListener('keydown', event => { if (event.key === 'm' || event.key === 'M') game.muted = !game.muted; }); // M: the mute toggle
  Object.assign(window, { __yatzy: game, __save: save });
  game.open({ tutorial: tutorialOpt });

  const root = document.getElementById('yatzy');
  const rollBtn = root.querySelector('.yatzy-roll');
  const mosiBtn = root.querySelector('.yatzy-mosi');
  const eggBtn = root.querySelector('.yatzy-egg');
  const dieBtns = root.querySelectorAll('.yatzy-die');
  const tutNextBtn = root.querySelector('.yatzy-tut-next');
  const tap = el => {
    if (!el) return;
    el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1, clientX: 10, clientY: 10 }));
    el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1, clientX: 10, clientY: 10 }));
  };

  if (state === 'tutorial-hold') {
    setTimeout(() => {
      tap(rollBtn);
      setTimeout(() => {
        tap(dieBtns[0]);
        setTimeout(() => { window.__demoReady = true; }, 450);
      }, 600);
    }, 250);
  } else if (state === 'tutorial-boards') {
    setTimeout(() => {
      tap(rollBtn);
      setTimeout(() => {
        tap(dieBtns[0]);
        tap(dieBtns[1]);
        tap(rollBtn);
        setTimeout(() => { window.__demoReady = true; }, 650);
      }, 600);
    }, 250);
  } else if (state === 'yatzy') {
    setTimeout(() => {
      tap(rollBtn);
      setTimeout(() => { window.__demoReady = true; }, 900);
    }, 250);
  } else if (state === 'mosi') {
    setTimeout(() => {
      tap(rollBtn);
      setTimeout(() => {
        tap(dieBtns[0]);
        tap(dieBtns[1]);
        tap(mosiBtn);
        setTimeout(() => { window.__demoReady = true; }, 450);
      }, 650);
    }, 250);
  } else if (state === 'egg') {
    setTimeout(() => {
      tap(rollBtn);
      setTimeout(() => {
        tap(dieBtns[0]);
        tap(dieBtns[1]);
        tap(eggBtn);
        setTimeout(() => { window.__demoReady = true; }, 550);
      }, 650);
    }, 250);
  } else if (state === 'win') {
    // The child has every row but Yatzy, Slóeðla has all hers, and five Þórseðlur lie on the table: tap Yatzy! for the end.
    setTimeout(() => {
      const ids = [...root.querySelectorAll('.yatzy-row')].map(row => row.dataset.cat);
      const child = {};
      const sloedla = {};
      ids.forEach(id => { if (id !== 'yatzy') child[id] = 6; sloedla[id] = 4; });
      game.setGame({ ...game.game, scores: { child, sloedla }, round: ids.length, dice: [3, 3, 3, 3, 3], rolled: true, rollsLeft: 0, held: [false, false, false, false, false] });
      window.__demoReady = true;
    }, 400);
  } else {
    setTimeout(() => { window.__demoReady = true; }, 600);
  }
</script>
</body>
</html>
