<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Háls og hali — tilraunasíða</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<!-- The world of "Háls og hali" on a page of its own, never linked from the game: Codex's board of 80 squares on five tiers,
     side-on, with the chapter's Þórseðlas and Egill on Mosi. The game proper (its "Eitt!" look, the voices, the sounds, the
     book) is Task 3's; this page is for looking at the world and trying a game in it.
       ?view=overview (the default) | follow    the whole board, or close on the piece whose turn it is
       &players=1..4 &computer=1                  how many pieces (the last one Þórseðla's when computer=1)
       &at=N[,N...]                               where the pieces stand to begin with
       &roll=N                                    the first piece rolls N by itself once the page is ready
       &calm=1                                    calm mode
       &quality=low|tablet|high                   the preset (engine/quality.js)
       &debug=1                                   draw calls, triangles and frame time in the corner
     Keys: space rolls, o the whole board, f follow, m calm mode. -->
<style>
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #debug { position: fixed; left: 8px; top: 8px; font: 12px/1.3 ui-monospace, monospace; color: #fffaf0; background: rgba(40, 30, 20, 0.55); padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view" aria-label="Háls og hali"></canvas>
<div id="debug" hidden></div>
<script type="module">
import { pickQuality } from './engine/quality.js';
import { createRenderer } from './engine/renderer.js';
import { installStats } from './engine/stats.js';
import { SPECIAL_TILES } from './engine/hals/rules.js';
import { createHalsWorld } from './engine/hals/world.js';

const params = new URLSearchParams(location.search);
const q = pickQuality(params);
const canvas = document.getElementById('view');
const display = createRenderer(canvas, q);
const { renderer } = display;
const world = await createHalsWorld(renderer, { q, params });
window.__world = world;
world.board.decorate(SPECIAL_TILES);
const fit = () => { display.applySize(world.camera); world.resize(canvas.clientWidth, canvas.clientHeight); };
fit();
addEventListener('resize', fit);
world.view.calm = params.get('calm') === '1';
world.view.overview().cut();

const debugEl = document.getElementById('debug');
debugEl.hidden = params.get('debug') !== '1';
const drawNow = () => { renderer.info.reset(); world.render(); };
const stats = installStats({ renderer, scene: world.scene, q, render: drawNow, debugEl, getScale: () => display.resolutionScale });

let last = performance.now(), frames = 0, ready = false;
world.ready().then(() => { ready = true; });
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  world.update(dt);
  drawNow();
  stats.sample(dt);
  if (ready && ++frames >= 30 && !window.__demoReady) window.__demoReady = true;
});
</script>
</body>
</html>
