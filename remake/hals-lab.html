<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Háls og hali — tilraunasíða</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<!-- The valley of "Háls og hali" on a page of its own, never linked from the game: to look at it and to try the pawns and the egg.
       ?view=overview (the default)   the whole valley from the front
       ?view=close&square=N           the camera close behind square N (default 13: the first neck's top, a star near)
       &hop=1                         Egill on Mosi hops along a few squares by himself, then Þórseðla's figure, and so on
       &quality=low|tablet|high       the preset (engine/quality.js)
       &debug=1                       draw calls, triangles and frame time in the corner
     Keys: o overview, c close on Egill, t close on Þórseðla's figure, space (or a tap on the egg) rolls the egg and the pawn whose turn
     it is hops that many squares, n lifts on the nearest neck, l slides down the nearest tail.
     capture.mjs waits for __demoReady: the valley built, its Þórseðlas' light levels ready and a few frames drawn. -->
<style>
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #debug { position: fixed; left: 8px; top: 8px; font: 12px/1.3 ui-monospace, monospace; color: #fffaf0; background: rgba(40, 30, 20, 0.55); padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view" aria-label="Dalurinn"></canvas>
<div id="debug" hidden></div>
<script type="module">
import * as THREE from 'three';
import { pickQuality } from './engine/quality.js';
import { createRenderer } from './engine/renderer.js';
import { installStats } from './engine/stats.js';
import { BOARD } from './engine/hals/rules.js';
import { createValley } from './engine/hals/valley.js';

const params = new URLSearchParams(location.search);
const q = pickQuality(params);
const canvas = document.getElementById('view');
const display = createRenderer(canvas, q);
const { renderer } = display;
const valley = await createValley(renderer, { board: BOARD, q, params });
window.__valley = valley;

const fit = () => { display.applySize(valley.camera); valley.resize(canvas.clientWidth, canvas.clientHeight); };
fit();
addEventListener('resize', fit);

const view = params.get('view') || 'overview';
if (view === 'close') valley.camera.follow(Number(params.get('square') || 13)).cut();
else valley.camera.overview().cut();

const debugEl = document.getElementById('debug');
debugEl.hidden = params.get('debug') !== '1';
const drawNow = () => { renderer.info.reset(); valley.render(); };
const stats = installStats({ renderer, scene: valley.scene, q, render: drawNow, debugEl, getScale: () => display.resolutionScale });

// For the budget: what each part of the frame costs in draw calls and triangles (shadow pass included), each taken out in turn.
window.__parts = () => {
  const count = () => { drawNow(); return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; };
  const all = count();
  const groups = {
    forest: [valley.world.forest.group],
    thorsedlas: valley.thorsedlas.map(t => t.root),
    stones: valley.scene.children.filter(o => /Stones|Numerals|Stone glow/.test(o.name)),
    props: valley.scene.children.filter(o => /Fruit|Stream|Puddles|Fireflies/.test(o.name)),
  };
  const grass = valley.world.forest.group.children.filter(o => /grass/i.test(o.name));
  if (grass.length) groups.grass = grass;
  const out = { all };
  for (const [name, objects] of Object.entries(groups)) {
    const was = objects.map(o => o.visible);
    objects.forEach(o => { o.visible = false; });
    const without = count();
    objects.forEach((o, i) => { o.visible = was[i]; });
    out[name] = { calls: all.calls - without.calls, tris: all.tris - without.tris };
  }
  out.levels = valley.thorsedlas.map(t => { let g = null; t.actor.model.traverse(o => { if (o.isSkinnedMesh && !g) g = o.geometry; }); return g.index.count / 3; });
  console.log('[parts]', JSON.stringify(out));
  return out;
};

addEventListener('keydown', event => {
  if (event.key === 'o') valley.camera.overview();
  if (event.key === 'c') valley.camera.follow(Number(params.get('square') || 13));
});

let last = performance.now();
let frames = 0;
let ready = false;
valley.ready.then(() => { ready = true; });
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  valley.update(dt);
  drawNow();
  stats.sample(dt);
  if (ready && ++frames >= 30) window.__demoReady = true;
});
</script>
</body>
</html>
