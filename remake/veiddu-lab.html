<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veiddu — tilraunasíða</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./book.css">
<link rel="stylesheet" href="./veiddu.css">
<script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<!-- "Veiddu" on a page of its own, never linked from the game. With no ?state= (or state=live) a real round is played with Uggeðla and Mosi
     (engine/veiddu/table.js), on a save held in the page (the game's own comes with the book, Task 8), and a round that is shut deals the
     next. &seed=<text> deals the same round every time, &skill=0 to 1 sets the minds' skill, and &auto=1 plays the child's moves by
     itself (bestAsk, after 1.2 s each), so a whole round plays on its own for a video (tools/veiddu-video.mjs). window.__veiddu is the
     game (its phase, game and dealt, for a probe). It links book.css for the touch the book and the game share (fx.js: the squash and
     the sparks), as the game's page will. The other states are the look as still markup in veiddu.css's classes (look.js draws them):
       live       a real round (the default)
       table      a round under way: Uggeðla's picture in her window, Mosi's, their cards and pairs, the pond, the child's cards
       ask        a card picked (Skjaldbaka lifted) and both windows glowing: whom to ask?
       asked      Mosi asks the child "Áttu frosk?" and the frog lifts; &have=0 asks for an animal the child does not hold and the big
                  "Farðu að veiða!" button comes
       fish       Uggeðla said no: "Nei! Farðu að veiða!" and the pond calls; &splash=1 catches the thrown water in the air
       win        the round won: the words, Uggeðla's sticker for the book, "Spilum aftur?" and confetti
       cards      every card, big, and the back
       advice     Mosi's help: he pops up with his reason and the card he means lifts and glows
     &hand=N (1 to 13) gives the child N distinct kinds in a still state: 13 is a full hand, for the widths of the cards. capture.mjs
     waits for __demoReady, which comes once the pictures are in (live: once the first deal has landed). -->
</head>
<body>
<main class="veiddu" id="veiddu"></main>
<script type="module">
  const params = new URLSearchParams(location.search);
  const { renderStill, STILL_STATES } = await import('./engine/veiddu/look.js');
  const live = !params.has('state') || params.get('state') === 'live';
  const root = document.getElementById('veiddu');

  if (live) {
    // A real round. The lab keeps the minds' skill in the page (so it follows the child from round to round, as the save's will).
    const [{ createVeidduGame }, { seededRandom }] = await Promise.all([import('./engine/veiddu/table.js'), import('./engine/random.js')]);
    const kept = { losses: 0, wins: 0, tutorialDone: false };
    if (params.has('skill')) kept.skill = Number(params.get('skill'));
    const save = { getVeiddu: () => ({ ...kept }), setVeiddu: changes => Object.assign(kept, changes) };
    const game = createVeidduGame(document, {
      save,
      random: params.has('seed') ? seededRandom(params.get('seed')) : Math.random,
      auto: params.get('auto') === '1',
      onClose: () => setTimeout(() => game.open(), 600), // the lab has no book to go back to: the next round is dealt
    });
    Object.assign(window, { __veiddu: game, __veidduSave: kept });
    game.open();
    while (game.dealt < 1) await new Promise(resolve => setTimeout(resolve, 100));
  } else {
    renderStill(document, root, STILL_STATES.includes(params.get('state')) ? params.get('state') : 'table', params);
    if (params.get('view') === '1') {
      // &view=1 puts Uggeðla live in her window on a still too (a capture of her view; the stills keep her picture otherwise).
      const { createUggedlaView } = await import('./engine/veiddu/uggedla-view.js');
      const frame = document.querySelector('.veiddu-uggedla');
      const view = await createUggedlaView(frame, { win: window });
      frame.querySelector('img').hidden = true;
      view.start();
      window.__uggedla = view;
    }
  }

  /** Waits until the font and pictures are in and nothing is moving but the idle life. */
  async function settle() {
    await document.fonts.ready;
    if (document.readyState !== 'complete') await new Promise(resolve => addEventListener('load', resolve, { once: true }));
    for (let round = 0; round < 3; round++) {
      await Promise.all([...document.images].map(img => img.decode?.().catch(() => {})));
      const moving = document.getAnimations().filter(animation => animation.effect?.getTiming().iterations !== Infinity && animation.playState === 'running');
      await Promise.all(moving.map(animation => animation.finished.catch(() => {})));
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }
  }
  await settle();
  window.__demoReady = true;
</script>
</body>
</html>
