<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>Fjölspil</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./spil.css">
<link rel="stylesheet" href="./eitt.css">
<!-- The guest's page of "Fjölspil" (engine/fjolspil/guest.js, spec §4 and §8): what a phone, a tablet or a PC beside the big
     screen opens, from the lobby's QR code (spil.html?r=GULL) or typed by hand (then it asks for the four letters).
       ?r=GULL                      the room: the page goes in at once and asks for a name and an avatar
       ?demo=code|join|lobby|wait|closed|over|hals|eitt
                                    a sample of each screen with no connection, for the captures (capture.mjs waits for
                                    __demoReady); hals and eitt show the closed screen until their phone screens come
     It never draws a QR code: the phone is the one that scans. -->
</head>
<body>
<div id="spil" class="spil"></div>
<script type="module">
import { createGuestPage } from './engine/fjolspil/guest.js';
import { createGuestNet, iceServersFor, wsUrlFor } from './engine/fjolspil/net.js';

// The room's meeting point beside this page (serve.mjs at home, the Worker in the cloud), as this phone's guest id.
const net = ({ code, guestId }) => createGuestNet({ url: wsUrlFor(location, code, { role: 'guest', id: guestId }), iceServers: iceServersFor(location) });
window.__spil = createGuestPage(document, { net });
</script>
</body>
</html>
