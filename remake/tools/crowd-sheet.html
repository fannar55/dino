<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<title>Hópdýr: stellingar</title>
<!--
  A crowd model (remake/tools/prep-crowd.mjs) drawn by the game's own crowds (world/critters/crowd.js, crowd-models.js), next to
  a frog from world/critters/models.js for size, for the owner to look at. Shot with remake/tools/capture.mjs:
    node remake/tools/capture.mjs --page remake/tools/crowd-sheet.html --size 1600x1000 --ready "window.__sheetReady === true"
      --out qa/remake/critters/smaedla --shot run="model=smaedla&clip=run" --shot idle="model=smaedla&clip=idle" ...
  sheet (the default): the clip's frames one by one, from the side and from above, 1 to 8.
  film: mode=film&t=<seconds>: the clips in turn (play), seen from the side and from above at 45 degrees, at that time; running,
  the animal goes forward its clip's stride a cycle over striped ground. Shots every 1/30 s, then ffmpeg, make a short film.
  model: the file in remake/assets/critters/ (smaedla, grasbitur); scale: the animal's (1); frog: the frog's (3).
-->
<style>
  html, body { margin: 0; background: #e9efe4; font-family: system-ui, sans-serif; color: #2c3326; overflow: hidden; }
  canvas { display: block; }
  .label { position: absolute; font-size: 22px; transform: translateX(-50%); white-space: nowrap; }
  .title { position: absolute; left: 24px; top: 14px; font-size: 30px; font-weight: 600; }
  .sub { position: absolute; left: 24px; font-size: 20px; opacity: 0.75; }
</style>
<script type="importmap">{"imports":{"three":"../../dist/vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createCrowds } from '../world/critters/crowd.js';
import { loadCrowdModel, clipPose } from '../world/critters/crowd-models.js';

const q = new URLSearchParams(location.search);
const NAME = q.get('model') || 'smaedla';
const MODE = q.get('mode') || 'sheet';
const CLIP = q.get('clip') || 'run';
const SCALE = Number(q.get('scale') || 1);
const FROG = Number(q.get('frog') || 3);
const T = Number(q.get('t') || 0);
const WORDS = { run: 'hleypur', idle: 'stendur kyrr', drink: 'drekkur', look: 'lítur upp', walk: 'gengur', trot: 'brokkar', graze: 'er á beit' };
// each animal's name, its name with the article and the word for long in its gender, and the film's clips in turn
const ANIMALS = {
  smaedla: { name: 'Smáeðla', the: 'eðlan', long: 'löng',
    film: [{ clip: 'run', seconds: 2.7 }, { clip: 'idle', seconds: 3 }, { clip: 'drink', seconds: 2.5 }, { clip: 'look', seconds: 3 }] },
  grasbitur: { name: 'Grasbítur', the: 'grasbíturinn', long: 'langur',
    film: [{ clip: 'graze', seconds: 4 }, { clip: 'look', seconds: 2 }, { clip: 'walk', seconds: 3 }, { clip: 'trot', seconds: 2.4 }] },
};
const ANIMAL = ANIMALS[NAME] ?? { name: NAME, the: NAME, long: 'löng', film: null };
const width = innerWidth, height = innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(width, height);
renderer.setClearColor(0xe9efe4);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfeefc, 0x5d6b45, 1.3));
const sun = new THREE.DirectionalLight(0xfff3df, 2.2);
sun.position.set(-3, 6, -4);
scene.add(sun);
const grass = new THREE.MeshLambertMaterial({ color: 0x7fa35a });

function label(text, x, y, cls = 'label') {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  document.body.appendChild(el);
}
const fmt = s => `${s}`.replace('.', ',');

const model = await loadCrowdModel(new URL(`../assets/critters/${NAME}.glb`, import.meta.url).href);
const crowds = createCrowds({ scene }, { seen: 1e6 });
crowds.reserve(NAME, 24, model);
crowds.reserve('frog', 4);
const length = (model.length ?? 0.8) * SCALE;
const at = (x, y, z) => new THREE.Vector3(x, y, z);
const ground = (x, z, w, d) => {
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, d), grass);
  plane.rotation.x = -Math.PI / 2;
  plane.position.set(x, -0.001, z);
  scene.add(plane);
};

// two views, each a camera on its own part of the scene (the side set at z = 0, the other 50 m off)
const views = [];
function view(camera, x, y, w, h) { views.push({ camera, x, y, w, h }); }

// A flyer (a model with a flap or glide clip) spans wider than it is long: its pages are flyerSheet and flyerFilm below.
const WINGED = 'flap' in model.clips || 'glide' in model.clips;

if (WINGED) {
  await (MODE === 'sheet' ? flyerSheet : flyerFilm)();
} else if (MODE === 'sheet') {
  const { frames, seconds } = model.clips[CLIP];
  const perRow = Math.ceil(frames / 2), step = length * 1.3, rowSide = 0.8 * length, rowTop = 0.55 * length;
  // left to right on screen: the frog, then the frames; both cameras see +X on the left, so x falls to the right
  const xOf = s => -s * step;
  const spots = [];
  crowds.begin(null);
  for (let k = 0; k < frames; k++) {
    const s = 1 + (k % perRow), row = Math.floor(k / perRow);
    const pose = { morphs: clipPose(model, CLIP, (k / frames) * seconds) };
    crowds.place(NAME, at(xOf(s), -row * rowSide, 0), 0, SCALE, pose);
    crowds.place(NAME, at(xOf(s), 0, 50 - row * rowTop), 0, SCALE, pose);
    spots.push({ text: `${k + 1}`, x: xOf(s) - 0.17 * length, row });
  }
  crowds.place('frog', at(xOf(0.1), 0, 0), 0, FROG);
  crowds.place('frog', at(xOf(0.1), 0, 50 - rowTop / 2), 0, FROG);
  crowds.end();
  const left = xOf(0) + 0.45 * length, right = xOf(perRow) - 0.7 * length;
  const middle = (left + right) / 2, spanX = (left - right) * 1.04;
  for (let row = 0; row < 2; row++) { // seen from the side, the ground is a strip under each row
    const strip = new THREE.Mesh(new THREE.BoxGeometry(spanX * 1.2, 0.012 * length, length), grass);
    strip.position.set(middle, -row * rowSide - 0.006 * length, 0.6 * length);
    scene.add(strip);
  }
  ground(middle, 50 - rowTop / 2, spanX * 1.2, 2 * rowTop + 2 * length);
  const head = 100, room = height - head;
  const sideView = { x: 0, y: room * 0.46, w: width, h: room * 0.54 };
  const topView = { x: 0, y: 0, w: width, h: room * 0.46 };
  const ortho = v => new THREE.OrthographicCamera(-spanX / 2, spanX / 2, spanX / 2 * v.h / v.w, -spanX / 2 * v.h / v.w, 0.1, 40);
  const side = ortho(sideView);
  side.position.set(middle, -rowSide / 2 + 0.22 * length, -20);
  side.lookAt(middle, side.position.y, 0);
  const top = ortho(topView);
  top.up.set(0, 0, 1);
  top.position.set(middle, 20, 50 - rowTop / 2 + 0.04 * length);
  top.lookAt(middle, 0, top.position.z);
  view(side, sideView.x, sideView.y, sideView.w, sideView.h);
  view(top, topView.x, topView.y, topView.w, topView.h);
  side.updateMatrixWorld();
  top.updateMatrixWorld();
  const onScreen = (camera, v, p) => {
    const n = p.clone().project(camera);
    return [v.x + (n.x + 1) / 2 * v.w, height - (v.y + (n.y + 1) / 2 * v.h)];
  };
  label(`${ANIMAL.name} ${WORDS[CLIP] ?? CLIP}: ${frames} stellingar á ${fmt(seconds)} s, frá hlið og ofan frá`, 0, 0, 'title');
  label(`stærð eins og í leiknum: ${ANIMAL.the} ×${SCALE} (${fmt(+length.toFixed(2))} m ${ANIMAL.long}), froskurinn ×${FROG}`, 0, 54, 'sub');
  for (const { text, x, row } of spots) {
    label(text, ...onScreen(side, sideView, at(x, -row * rowSide - 0.04 * length, 0)));
    label(text, ...onScreen(top, topView, at(x, 0, 50 - row * rowTop - 0.25 * length)));
  }
  label(`froskur ×${FROG}`, ...onScreen(side, sideView, at(xOf(0.1), -0.04 * length, 0)));
} else {
  const film = ANIMAL.film ?? Object.entries(model.clips).map(([clip, { seconds }]) => ({ clip, seconds: Math.max(2.5, 2 * seconds) }));
  let t = T, seg = film[0];
  for (const s of film) { seg = s; if (t < s.seconds) break; t -= s.seconds; }
  const pose = { morphs: clipPose(model, seg.clip, t) };
  // in a clip with a stride (run, walk, trot) it goes forward (+X) its stride a cycle and the cameras go with it: feet that
  // slide show against the stripes, a tenth of a metre wide for the small lizard and wider as the animal is longer
  const { seconds, stride = 0 } = model.clips[seg.clip];
  const go = stride * (t / seconds);
  const stripe = Math.max(0.1, Math.round(length / 8 / 0.05) * 0.05);
  crowds.begin(null);
  crowds.place(NAME, at(go, 0, 0), 0, SCALE, pose);
  crowds.place(NAME, at(go, 0, 50), 0, SCALE, pose);
  crowds.place('frog', at(0.95 * length, 0, 50 + 0.75 * length), 0, FROG);
  crowds.end();
  // the ground in stripes a tenth of a metre wide: seen edge on from the side, a checker from above
  const stripes = [0x5f8a3c, 0xa9c97f].map(color => new THREE.MeshLambertMaterial({ color }));
  for (let i = -30; i < 90; i++) {
    const tile = new THREE.Mesh(new THREE.BoxGeometry(stripe, 0.025 * length, length), stripes[(i + 30) % 2]);
    tile.position.set((i + 0.5) * stripe, -0.0125 * length, 0.6 * length);
    scene.add(tile);
  }
  const checker = document.createElement('canvas');
  checker.width = checker.height = 2;
  const pen = checker.getContext('2d');
  pen.fillStyle = '#7fa35a'; pen.fillRect(0, 0, 2, 2);
  pen.fillStyle = '#8fb366'; pen.fillRect(0, 0, 1, 1); pen.fillRect(1, 1, 1, 1);
  const map = new THREE.CanvasTexture(checker);
  map.colorSpace = THREE.SRGBColorSpace;
  map.magFilter = THREE.NearestFilter;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  const fieldSize = 15 * length;
  map.repeat.set(fieldSize / (2 * stripe), fieldSize / (2 * stripe));
  const field = new THREE.Mesh(new THREE.PlaneGeometry(fieldSize, fieldSize), new THREE.MeshLambertMaterial({ map }));
  field.rotation.x = -Math.PI / 2;
  field.position.set(2.5 * length, -0.001, 50);
  scene.add(field);
  const span = 1.5 * length, aspect = (width / 2) / (height - 70);
  const side = new THREE.OrthographicCamera(-span / 2, span / 2, span / 2 / aspect, -span / 2 / aspect, 0.1, 40);
  side.position.set(go - 0.05 * length, 0.35 * length, -20);
  side.lookAt(side.position.x, side.position.y, 0);
  const above = new THREE.PerspectiveCamera(30, aspect, 0.1, 100);
  above.position.set(go - 0.6 * length, 2.6 * length, 50 - 2.6 * length);
  above.lookAt(go, 0.15 * length, 50);
  view(side, 0, 0, width / 2, height - 70);
  view(above, width / 2, 0, width / 2, height - 70);
  label(`${ANIMAL.name} ${WORDS[seg.clip] ?? seg.clip}`, 0, 0, 'title');
  label(stride ? `rendurnar á jörðinni eru ${Math.round(stripe * 100)} cm: fæturnir eiga ekki að renna til` : `${fmt(seconds)} s, endurtekið`, 0, 50, 'sub');
}

for (const v of views) {
  renderer.setViewport(v.x, v.y, v.w, v.h);
  renderer.setScissor(v.x, v.y, v.w, v.h);
  renderer.render(scene, v.camera);
}
window.__sheetReady = true;

// ---- the flyer's pages (flugdyr) -------------------------------------------------------------------------------------------
// sheet: the clip's frames, one to eight, from the side, from the front and from above, each view in rows of its own camera,
// all at one scale; perched it stands on a ledge, flying it is drawn against the sky. A frog for size on a ledge of its own.
// film (mode=film&t=<seconds>): perch, flap and glide in turn, from the side and from behind and above.
function flyer() {
  return {
    name: NAME === 'flugdyr' ? 'Flugdýr' : NAME,
    say: { flap: 'blakar vængjunum', glide: 'svífur', perch: 'situr á syllu' },
    sky: 0xd3e5f3, page: 0xe9efe4,
    ledge: new THREE.MeshLambertMaterial({ color: 0x8d8478 }),
  };
}

/** The box the clip's frames fill (the morph targets are offsets from the rest shape), at the animal's scale. */
function framesBox(clip, frames) {
  const geometry = model.lods[0].geometry;
  const rest = geometry.getAttribute('position');
  const targets = geometry.morphAttributes.position ?? [];
  const box = new THREE.Box3(), p = new THREE.Vector3(), d = new THREE.Vector3();
  for (let k = 0; k < frames; k++) {
    const target = targets.find(t => t.name === `${clip}.${k}`);
    for (let i = 0; i < rest.count; i++) {
      p.fromBufferAttribute(rest, i);
      if (!target) { /* the rest shape */ } else if (geometry.morphTargetsRelative) p.add(d.fromBufferAttribute(target, i));
      else p.fromBufferAttribute(target, i);
      box.expandByPoint(p.multiplyScalar(SCALE));
    }
  }
  return box;
}

async function flyerSheet() {
  const FLYER = flyer();
  const { frames, seconds } = model.clips[CLIP];
  const perched = !['flap', 'glide'].includes(CLIP);
  const box = framesBox(CLIP, frames).expandByPoint(new THREE.Vector3(0, 0, 0));
  const size = box.getSize(new THREE.Vector3());
  const restSize = new THREE.Box3().setFromBufferAttribute(model.lods[0].geometry.getAttribute('position'))
    .getSize(new THREE.Vector3()).multiplyScalar(SCALE);
  const { createModel } = await import('../world/critters/models.js');
  const frogBox = new THREE.Box3().setFromBufferAttribute(createModel('frog').geometry.getAttribute('position'));
  const fb = { min: frogBox.min.clone().multiplyScalar(FROG), max: frogBox.max.clone().multiplyScalar(FROG) };
  // each view: how far apart its frames stand (along the screen), the animal's extent across the screen and along it, and
  // the frog's the same ways
  const VIEWS = [
    { key: 'side', name: 'frá hlið', step: 1.15 * size.x, across: [box.min.y, box.max.y], from: [-box.max.x, -box.min.x],
      frogAcross: [fb.min.y, fb.max.y], frogFrom: [-fb.max.x, -fb.min.x] },
    { key: 'front', name: 'framan frá', step: 1.06 * size.z, across: [box.min.y, box.max.y], from: [-box.max.z, -box.min.z],
      frogAcross: [fb.min.y, fb.max.y], frogFrom: [-fb.max.z, -fb.min.z] },
    { key: 'top', name: 'ofan frá', step: 1.15 * size.x, across: [box.min.z, box.max.z], from: [-box.max.x, -box.min.x],
      frogAcross: [fb.min.z, fb.max.z], frogFrom: [-fb.max.x, -fb.min.x] },
  ];
  const NUMBERS = 30, GAP = 8, SIDE = 24, head = 100;
  const room = { w: width - 2 * SIDE, h: height - head };
  // rows of 4 or 8 frames, whichever draws the animal larger
  const plan = perRow => {
    const bands = [];
    for (const v of VIEWS) for (let b = 0; b * perRow < frames; b++) {
      const count = Math.min(perRow, frames - b * perRow);
      // the first row starts with the frog, as far before frame 1 as a step or, when it is wider, clear of it
      const frogU = Math.min(0, v.step + v.from[0] - 0.05 * v.step - v.frogFrom[1]);
      const u0 = b ? 0.5 * v.step + v.from[0] - 0.02 * v.step : Math.min(-0.35 * v.step + v.from[0], frogU + v.frogFrom[0]) - 0.02 * v.step;
      const u1 = count * v.step + v.from[1] + 0.02 * v.step;
      const lo = b ? v.across[0] : Math.min(v.across[0], v.frogAcross[0]), hi = b ? v.across[1] : Math.max(v.across[1], v.frogAcross[1]);
      const pad = 0.04 * (hi - lo);
      bands.push({ view: v, band: b, count, u0, u1, v0: lo - pad, v1: hi + pad, frogU });
    }
    const wide = Math.max(...bands.map(b => b.u1 - b.u0));
    const tall = bands.reduce((t, b) => t + b.v1 - b.v0, 0);
    const k = Math.min(room.w / wide, (room.h - bands.length * (NUMBERS + GAP)) / tall);
    return { bands, k, perRow };
  };
  const { bands, k, perRow } = [plan(4), plan(8)].sort((a, b) => b.k - a.k)[0];

  crowds.begin(null);
  const ledge = FLYER.ledge;
  const slab = (x, z, w, d) => { // a ledge, its top at y = 0, x and z its middle
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05 * size.y + 0.02, d), ledge);
    m.position.set(x, -(0.05 * size.y + 0.02) / 2, z);
    scene.add(m);
  };
  const placed = [];
  bands.forEach((band, i) => {
    const base = new THREE.Vector3(1000 * i, 0, 1000 * i); // each row far from the others: no camera sees two
    const v = band.view;
    const spot = s => (v.key === 'front' ? base.clone().add(at(0, 0, -s * v.step)) : base.clone().add(at(-s * v.step, 0, 0)));
    for (let j = 0; j < band.count; j++) {
      const kf = band.band * perRow + j;
      const pose = { morphs: clipPose(model, CLIP, (kf / frames) * seconds) };
      crowds.place(NAME, spot(j + 1), 0, SCALE, pose);
      placed.push({ band: i, text: `${kf + 1}`, u: (j + 1) * v.step });
      if (perched && v.key !== 'top') {
        const p = spot(j + 1);
        if (v.key === 'side') slab(p.x, p.z + 0.08 * size.z + 0.5, v.step * 1.0, 1);
        else slab(p.x - 0.08 * size.x - 0.5, p.z, 1, v.step * 1.0);
      }
    }
    if (band.band === 0) { // the frog, on a ledge of its own
      const p = spot(band.frogU / v.step), wide = 1.1 * (v.frogFrom[1] - v.frogFrom[0]);
      crowds.place('frog', p, 0, FROG);
      if (v.key === 'side') slab(p.x, p.z + 0.5, wide, 1);
      else if (v.key === 'front') slab(p.x - 0.5, p.z, 1, wide);
      placed.push({ band: i, text: `froskur ×${FROG}`, u: band.frogU });
    }
    if (v.key === 'top' && perched) {
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(band.u1 - band.u0 + 2, band.v1 - band.v0 + 2), ledge);
      ground.rotation.x = -Math.PI / 2;
      ground.position.set(base.x - (band.u0 + band.u1) / 2, -0.02, base.z + (band.v0 + band.v1) / 2);
      scene.add(ground);
    }
    band.base = base;
  });
  crowds.end();

  // the rows top to bottom, each centred
  renderer.setScissorTest(false);
  renderer.setClearColor(FLYER.page);
  renderer.clear();
  renderer.setScissorTest(true);
  let y = height - head;
  bands.forEach((band, i) => {
    const v = band.view, base = band.base;
    const w = (band.u1 - band.u0) * k, hView = (band.v1 - band.v0) * k + NUMBERS;
    const x = SIDE + (room.w - w) / 2;
    y -= hView;
    const extra = NUMBERS / k; // the numbers' strip under the frames, in metres
    const uc = (band.u0 + band.u1) / 2, vc = (band.v0 + band.v1 - extra) / 2;
    const halfU = (band.u1 - band.u0) / 2, halfV = (band.v1 - band.v0 + extra) / 2;
    const camera = new THREE.OrthographicCamera(-halfU, halfU, halfV, -halfV, 0.1, 40);
    if (v.key === 'side') { camera.position.set(base.x - uc, vc, base.z - 20); camera.lookAt(base.x - uc, vc, base.z); }
    else if (v.key === 'front') { camera.position.set(base.x + 20, vc, base.z - uc); camera.lookAt(base.x, vc, base.z - uc); }
    else { camera.up.set(0, 0, 1); camera.position.set(base.x - uc, 20, base.z + vc); camera.lookAt(base.x - uc, 0, base.z + vc); }
    camera.updateMatrixWorld();
    renderer.setViewport(x, y, w, hView);
    renderer.setScissor(x, y, w, hView);
    renderer.setClearColor(perched ? FLYER.page : FLYER.sky);
    renderer.render(scene, camera);
    const top = height - (y + hView);
    if (band.band === 0) label(v.name, x + 8, top + 4, 'sub');
    for (const p of placed.filter(q => q.band === i)) label(p.text, x + (p.u - band.u0) * k, top + hView - NUMBERS + 2);
    y -= GAP;
  });
  label(`${FLYER.name} ${FLYER.say[CLIP] ?? CLIP}: ${frames} stellingar á ${fmt(seconds)} s, frá hlið, framan frá og ofan frá`, 0, 0, 'title');
  label(`stærð eins og í leiknum: ×${SCALE}, ${fmt(+restSize.z.toFixed(2))} m milli vængbrodda og ${fmt(+restSize.x.toFixed(2))} m `
    + `frá goggi aftur á sporð; froskurinn ×${FROG}`, 0, 54, 'sub');
}

async function flyerFilm() {
  const FLYER = flyer();
  const film = [{ clip: 'perch', seconds: 4 }, { clip: 'flap', seconds: 2 }, { clip: 'glide', seconds: 3 }]
    .filter(s => s.clip in model.clips);
  let t = T, seg = film[0];
  for (const s of film) { seg = s; if (t < s.seconds) break; t -= s.seconds; }
  const perched = seg.clip === 'perch';
  const restBox = new THREE.Box3().setFromBufferAttribute(model.lods[0].geometry.getAttribute('position'));
  const L = (restBox.max.x - restBox.min.x) * SCALE, S = (restBox.max.z - restBox.min.z) * SCALE;
  crowds.begin(null);
  crowds.place(NAME, at(0, 0, 0), 0, SCALE, { morphs: clipPose(model, seg.clip, t) });
  crowds.end();
  if (perched) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.4 * L, 0.6 * L, 1.2 * S), FLYER.ledge);
    m.position.set(-0.1 * L, -0.3 * L, 0);
    scene.add(m);
  }
  const aspect = (width / 2) / (height - 70), span = 1.6 * L;
  const side = new THREE.OrthographicCamera(-span / 2, span / 2, span / 2 / aspect, -span / 2 / aspect, 0.1, 40);
  side.position.set(-0.05 * L, 0.3 * L, -20);
  side.lookAt(side.position.x, side.position.y, 0);
  const behind = new THREE.PerspectiveCamera(32, aspect, 0.05, 100);
  behind.position.set(-2.2 * L, 1.4 * L, -1.1 * L);
  behind.lookAt(0, 0.25 * L, 0);
  renderer.setScissorTest(false);
  renderer.setClearColor(FLYER.page);
  renderer.clear();
  renderer.setScissorTest(true);
  for (const [camera, x] of [[side, 0], [behind, width / 2]]) {
    camera.updateMatrixWorld();
    renderer.setViewport(x, 0, width / 2, height - 70);
    renderer.setScissor(x, 0, width / 2, height - 70);
    renderer.setClearColor(perched ? FLYER.page : FLYER.sky);
    renderer.render(scene, camera);
  }
  label(`${FLYER.name} ${FLYER.say[seg.clip] ?? seg.clip}`, 0, 0, 'title');
  label(`${fmt(model.clips[seg.clip].seconds)} s, endurtekið`, 0, 50, 'sub');
}
</script>
</body>
