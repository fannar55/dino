<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Háls og hali — leikurinn, tilraunasíða</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./book.css">
<link rel="stylesheet" href="./hals.css">
<script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<!-- "Háls og hali", the game proper (engine/hals/game.js), on a page of its own, never linked from the game: the same game the book
     opens, on a renderer of this page's own and a save of its own (mosi-hals-lab, so the game's progress is untouched).
       ?players=1..4 &mode=adventure|classic &start=1   start a game at once (1: the child against Þórseðla)
       &at=N[,N...]                                       where the pieces stand to begin with (and &turn=i whose turn it is)
       &roll=N                                            the child rolls N by itself once the game waits for a roll
       &intro=0|1                                         skip Mosi's intro, or hear it again; &fresh=1 a save in memory only
       &calm=1                                            calm, as under prefers-reduced-motion; &mute=1 silence; &quality=low|tablet|high; &debug=1 the frame's cost
       &music=qa/remake/hals/music/hals-music-d.mp3       a track to try in place of assets/audio/hals/music.mp3
       &audiolog=1                                        log the music's sources and gains in window.__audioLog (a probe)
     capture.mjs waits for __demoReady: the board in and the setup shown, or (with start) the first roll waited for. -->
</head>
<body>
<canvas id="view" aria-label="Háls og hali"></canvas>
<div id="hals" class="hals" hidden></div>
<div id="debug" class="debug" hidden></div>
<script type="module">
import { pickQuality } from './engine/quality.js';
import { createRenderer } from './engine/renderer.js';
import { installStats } from './engine/stats.js';
import { createSave } from './engine/save.js';
import { createAudioContext, createOutput } from './engine/audio/output.js';
import { createGame } from './engine/hals/rules.js';
import { createHalsGame } from './engine/hals/game.js';

const params = new URLSearchParams(location.search);
const q = pickQuality(params);
const canvas = document.getElementById('view');
const display = createRenderer(canvas, q);
const { renderer } = display;
display.applySize();
const read = async path => { try { const r = await fetch(path); return r.ok ? r.json() : null; } catch { return null; } };
const [lines, theme] = await Promise.all([read('./assets/audio/lines.json'), read('./assets/audio/theme.json')]);
if (params.get('audiolog') === '1') {
  // For a probe: every buffer source started and stopped, and every gain's target, in window.__audioLog.
  const log = window.__audioLog = [];
  const now = node => Math.round((node.context?.currentTime ?? 0) * 100) / 100;
  const start = AudioBufferSourceNode.prototype.start;
  AudioBufferSourceNode.prototype.start = function (when = 0, offset = 0, ...rest) {
    if (this.buffer?.duration > 20) log.push({ at: now(this), start: true, duration: +this.buffer.duration.toFixed(3), rate: this.buffer.sampleRate, loop: this.loop, loopStart: +this.loopStart.toFixed(3), loopEnd: +this.loopEnd.toFixed(3), offset: +offset.toFixed(3) });
    return start.call(this, when, offset, ...rest);
  };
  const stop = AudioBufferSourceNode.prototype.stop;
  AudioBufferSourceNode.prototype.stop = function (when = 0) {
    if (this.buffer?.duration > 20) log.push({ at: now(this), stop: true, when: +when.toFixed(2) });
    return stop.call(this, when);
  };
  const target = AudioParam.prototype.setTargetAtTime;
  AudioParam.prototype.setTargetAtTime = function (value, when, constant) {
    if (value > 0.05 && value < 0.31 || value === 0) log.push({ at: Math.round(when * 100) / 100, gain: +value.toFixed(3) });
    return target.call(this, value, when, constant);
  };
}
const mute = params.get('mute') === '1';
const context = mute ? null : createAudioContext();
const output = context && createOutput(context);
const save = createSave(params.get('fresh') === '1' ? null : undefined, 'mosi-hals-lab');
if (params.get('intro') === '0') save.setHalsPlay({ intro: true, hello: true });
if (params.get('intro') === '1') save.setHalsPlay({ intro: false, hello: false });

const players = Math.min(4, Math.max(1, Number(params.get('players')) || 1));
const mode = params.get('mode') === 'classic' ? 'classic' : 'adventure';
const at = (params.get('at') || '').split(',').filter(Boolean).map(Number);
if (at.length) {
  // A game set up where the lab says, kept as a game under way: "Halda áfram" (or &start) goes on from there.
  const count = players === 1 ? 2 : players;
  let state = createGame({ playerCount: count, vsComputer: players === 1, mode });
  state = { ...state, players: state.players.map((p, i) => ({ ...p, position: Number.isInteger(at[i]) ? at[i] : 0 })), currentPlayer: Math.min(count - 1, Number(params.get('turn')) || 0), turnCount: 4 };
  save.setHalsPlay({ game: { state, setup: { players, mode } } });
}

const music = params.get('music'); // a track to try in place of assets/audio/hals/music.mp3 (a path from the repository's root)
const game = createHalsGame(document, {
  save, renderer, q, params, audio: { context, output, theme, lines, muted: mute },
  ...(music && { musicUrl: new URL(`../${music.replace(/^\/+/, '')}`, location.href).href }),
  onClose: () => setTimeout(() => game.open(), 600), // the lab has no book: the game opens again
});
window.__hals = game;
window.__save = save;
addEventListener('resize', () => display.applySize());
if (params.get('calm') === '1') game.calm = true;
game.open();

const debugEl = document.getElementById('debug');
debugEl.hidden = params.get('debug') !== '1';
let stats = null;
const waitFor = async (test, ms = 60000) => { const end = performance.now() + ms; while (!test() && performance.now() < end) await new Promise(r => setTimeout(r, 100)); return test(); };
await waitFor(() => game.world);
stats = installStats({ renderer, scene: game.world.scene, q, render: () => { renderer.info.reset(); game.world.render(); }, debugEl, getScale: () => display.resolutionScale });
let last = performance.now();
(function sample(now) { stats.sample((now - last) / 1000); last = now; requestAnimationFrame(sample); })(last);
await game.world.ready();
if (params.get('start') === '1') {
  const kept = save.getHalsPlay().game;
  if (kept) document.querySelector('.hals-continue')?.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1 })) ;
  if (kept) document.querySelector('.hals-continue')?.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
  else game.start({ players, mode });
  await waitFor(() => game.phase === 'child' && game.pieces);
  await game.pieces.ready();
  if (params.has('roll')) game.roll(Number(params.get('roll')));
}
await new Promise(r => setTimeout(r, 600));
window.__demoReady = true;
</script>
</body>
</html>
